# Orchestration guidance for the AGENTS. Nothing in utils/ reads this file: these
# are limits an agent is asked to honour while working, not settings any code
# enforces. Treat a value here as documentation with a number in it, and if
# something ever needs to enforce one, make it read this rather than hardcoding a
# second copy.

[pipeline]
max_inflight_build = 1     # heavy build/test stages at once per host (single GPU)
lookahead_planners = 1     # plan the next project while the current one ports

# Claiming is no longer time-based. A project is claimed by its port/<name> branch
# existing on the remote, and the fork-write lock is status.json `porting`
# {arch, since}. Takeover is a human decision -- if the lock is held by another arch,
# ask the person running the agent rather than expiring it on a timer -- so there is
# no TTL or heartbeat to configure.

[porter]
max_attempts = 3           # failed validation cycles before blocking and asking
