# MOAT license policy.
#
# Four tiers. The tier governs whether a port may be OFFERED UPSTREAM, and nothing
# else -- it does not decide whether a project is taken up, since only an admin can
# create the fork that releases it. Record the licence at intake anyway: knowing the
# answer before the work is done costs nothing, and not knowing it blocks the PR.
#
#   tier1  cleared to contribute.
#   tier2  approved for CONTRIBUTING to a third-party project. Note carefully: that
#          is NOT approval to include the project in the ROCm software stack, which
#          needs a separate legal consult. If a ported project later becomes a ROCm
#          dependency, this caveat resurfaces.
#   tier3  strong copyleft (GPL-3, LGPL-3, AGPL). Contributing a fix triggers no
#          obligation on us, but these are not on the auto-approved list, so a
#          project at this tier waits for someone to decide it is wanted.
#   tier4  not open source at all (non-commercial, research-only, unlicensed).
#          Not enumerable -- it is whatever falls through the tiers above. Porting
#          may still be legitimate (many such licences permit internal
#          non-commercial use), but contributing requires the copyright holder's
#          permission by email, never a PR or an issue.
#
# Hand-maintained. The list is effectively static and changes arrive as PRs against
# this file, so there is deliberately no generator: a regeneration path that never
# runs is the same species of lie as the schema that drifted until nothing could
# satisfy it. Edits show up as a reviewable diff naming exactly which licence moved.
#
# SCOPE -- the part that actually constrains us.
#
# Everything here is about CONTRIBUTING a fix upstream. None of it covers USING a
# project in AMD software, shipping it, or depending on it. A non-commercial licence
# in particular bars use while leaving contribution unremarkable. So a project at any
# tier that later becomes a dependency rather than a contribution is a new question.
# Projects record that scope in status.json.license_clearance.note for that reason.
#
# HOW A PROJECT GETS TAKEN UP: the fork appearing in the org. Creating one is a
# deliberate act by someone who can, so its existence carries the decision. Nothing
# here needs to model who decided or how.
#
# CI enforces: valid SPDX syntax, sorted, deduplicated, and NO IDENTIFIER IN TWO
# TIERS. That last check matters most -- adding GPL-3.0 to tier1 while it sits in
# tier3 would make its classification meaningless.

[tier1]
description = "Approved without condition. Port and contribute freely."
