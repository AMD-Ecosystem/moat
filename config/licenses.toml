# Independent of the repo's top-level licence: ANY file carrying an NVIDIA
# proprietary licence puts the project in tier 3. This is a per-file rule, so intake
# scans the tree, not just LICENSE -- nvdiffrast is Apache-2.0-adjacent at the root
# and NVIDIA Source Code License in substance.
#
# Match on licence TEXT, not copyright lines. A naive grep for "NVIDIA" flags every
# CUDA project; projects/cuBQL/notes.md records the counterexample -- 66 SPDX tags
# with NVIDIA copyrights all under Apache-2.0, which is clean.
[tier3.nvidia_proprietary]
requires_osrb = true
text_markers = [
  "NVIDIA Source Code License",
  "NVIDIA Software License Agreement",
  "NVIDIA CORPORATION and its licensors retain all intellectual property",
  "NVIDIA End User License Agreement",
]

[scan]
# GitHub's licenseInfo is not sufficient on its own: it reports NOASSERTION or NONE
# for roughly a fifth of repos, most of which carry an ordinary approved licence it
# could not parse. Use a real detector and fall back to reading the licence file.
trust_github_license_field = false
detector = "licensee"
# EnvGS was blocked by an unlicensed SUBMODULE, not by its top-level licence, so a
# main-tree scan alone misses the case that actually bit us.
recurse_submodules = true
recurse_vendored = true
